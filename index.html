<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>शिक्षण परिषद उपस्थिती प्रपत्र</title>
<style>
:root {
  --navy: #1b2c47;
  --gold: #b8862e;
  --maroon: #7c2432;
  --ink: #232323;
  --bg: #f4f6f9;
  --card: #ffffff;
  --border: #d1d5db;
}
* { box-sizing: border-box; }
body {
  margin: 0; padding: 0;
  background: var(--bg); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Devanagari", sans-serif;
  min-height: 100vh;
}
h1, h2, h3 { margin: 0; }
button { font-family: inherit; cursor: pointer; }

/* Header */
header.top {
  background: var(--navy); color: #fff;
  padding: 15px 20px; border-bottom: 4px solid var(--gold);
  display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
}
.title-block h1 { font-size: 1.4rem; }
.title-block p { margin: 4px 0 0; font-size: 0.85rem; color: #cbd5e1; }

.btn {
  background: transparent; color: #fff;
  border: 1px solid var(--gold);
  padding: 6px 14px; border-radius: 6px; font-weight: 600; transition: 0.2s;
}
.btn:hover { background: rgba(184,134,46,0.2); }
.btn.solid { background: var(--gold); color: #fff; border: none; }
.btn.solid:hover { background: #9c7225; }
.btn.danger { background: #fee2e2; color: var(--maroon); border: 1px solid #fca5a5; }
.btn.success { background: #10b981; color: #fff; border: none; }
.btn.success:hover { background: #059669; }
.btn.dark { background: #334155; color: #fff; border: none; }
.btn.dark:hover { background: #1e293b; }
.btn.hm { background: #0284c7; color: #fff; border: none; }
.btn.hm:hover { background: #0369a1; }
.btn:disabled { opacity: 0.6; cursor: not-allowed; }

/* Tabs */
.tabs { display: flex; gap: 8px; margin-bottom: 15px; border-bottom: 2px solid var(--border); padding-bottom: 5px; flex-wrap: wrap; }
.tab-btn { background: none; border: none; font-size: 0.95rem; font-weight: 700; color: #64748b; padding: 8px 14px; border-radius: 6px; cursor: pointer; }
.tab-btn.active { background: var(--navy); color: #fff; }

/* Main Layout */
main { max-width: 1050px; margin: 15px auto; padding: 0 12px; padding-bottom: 50px; }
.card { background: var(--card); padding: 16px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 15px; }

/* Controls */
.controls { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
.controls input { flex: 1; min-width: 180px; padding: 9px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.95rem; }
.controls select { padding: 9px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.95rem; background: #fff; }

/* Tables */
.table-wrapper { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 550px; }
th, td { border: 1px solid var(--border); padding: 9px 10px; text-align: left; font-size: 0.9rem; }
th { background: #f8fafc; font-weight: 600; color: var(--navy); }
tr:hover { background: #f1f5f9; }
td.actions { text-align: center; white-space: nowrap; width: 90px; }
.icon-btn { background: none; border: none; font-size: 1.1rem; color: var(--navy); padding: 4px; cursor: pointer; }
.icon-btn.del { color: var(--maroon); margin-left: 6px; }

/* Dropdowns */
.att-select { padding: 5px; border-radius: 4px; border: 1px solid var(--border); font-family: inherit; font-size: 0.85rem; background: #fff; }
.att-select:disabled { background: transparent; border: none; color: var(--ink); appearance: none; -webkit-appearance: none; font-weight: bold; }
.att-present { color: #10b981; font-weight: bold; }
.att-absent { color: #ef4444; font-weight: bold; }
.att-leave { color: #f59e0b; font-weight: bold; }

/* Modals */
.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.5);
  display: none; align-items: center; justify-content: center; z-index: 100;
}
.overlay.show { display: flex; }
.modal { background: #fff; width: 90%; max-width: 420px; border-radius: 10px; overflow: hidden; }
.modal-head { background: var(--navy); color: #fff; padding: 12px 16px; display: flex; justify-content: space-between; }
.modal-body { padding: 16px; }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 4px; color: var(--navy); }
.field input, .field select { width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.95rem; }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
.error { color: var(--maroon); font-size: 0.8rem; min-height: 18px; }

/* Print Settings */
.print-settings { background: #e0f2fe; padding: 12px; border-radius: 8px; margin-bottom: 15px; display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; border: 1px solid #bae6fd; }
.print-settings .box { flex: 1; min-width: 140px; }
.print-settings input { width: 100%; padding: 7px; border: 1px solid #93c5fd; border-radius: 4px; font-family: inherit; }

/* Toast */
#toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 8px 16px; border-radius: 5px; font-size: 0.85rem; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 1000; }
#toast.show { opacity: 1; }

/* Print Styles */
#printArea { display: none; }
@media print {
  body * { visibility: hidden; }
  #printArea, #printArea * { visibility: visible; }
  #printArea { display: block; position: absolute; left: 0; top: 0; width: 100%; background: #fff; padding: 8mm; }
  
  .print-page-block { page-break-after: always; margin-bottom: 20px; }
  .print-page-block:last-child { page-break-after: avoid; }
  
  .print-header { text-align: center; margin-bottom: 12px; border-bottom: 2px solid #000; padding-bottom: 8px; }
  .print-header h1 { font-size: 18px; margin-bottom: 4px; }
  .print-meta { display: flex; justify-content: space-between; font-weight: bold; font-size: 12px; }
  .print-school-header { font-size: 13px; font-weight: bold; margin: 10px 0 3px; background: #e2e8f0; padding: 5px 8px; border: 1px solid #000; border-bottom: none; }
  
  table.print-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 10px; }
  table.print-table th, table.print-table td { border: 1px solid #000; padding: 5px 6px; text-align: left; vertical-align: middle; }
  table.print-table th { background: #f1f5f9 !important; -webkit-print-color-adjust: exact; text-align: center; }
  table.print-table td.center { text-align: center; }
}
</style>
</head>

<header class="top">

<div class="overlay" id="resetPinModal">

function getSafeStorage() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch(e) { return null; }
}

function setSafeStorage(data) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e) {}
}

function loadData() {
  const local = getSafeStorage();
  if (local && local.schools && local.schools.length > 0) {
    schools = local.schools;
    adminPin = local.pin || "";
  } else {
    schools = JSON.parse(JSON.stringify(DEFAULT_SCHOOLS));
  }
  initApp();

  if (window.fetch) {
    fetch(GOOGLE_APP_SCRIPT_URL + "?t=" + new Date().getTime())
      .then(res => res.text())
      .then(text => {
        if (!text || text.trim() === "" || text === "[]") return;
        const cloudData = JSON.parse(text);
        if (cloudData.schools && Array.isArray(cloudData.schools)) {
          let cloudSchools = cloudData.schools;
          const hasZp = cloudSchools.some(s => s.category === "zp" || (s.name && s.name.includes("जि. प.")));
          if (!hasZp) {
            const zpDefaults = DEFAULT_SCHOOLS.filter(s => s.category === "zp");
            cloudSchools = [...zpDefaults, ...cloudSchools];
          }
          schools = cloudSchools;
          adminPin = cloudData.pin || adminPin;
          setSafeStorage({ schools: schools, pin: adminPin });
          initApp();
        }
      })
      .catch(() => {});
  }
}

function saveData() { 
  setSafeStorage({ schools: schools, pin: adminPin }); 
}

function showToast(msg) {
  const t = document.getElementById("toast");
  if(!t) return;
  t.textContent = msg; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2500);
}
function openModal(id) { const el = document.getElementById(id); if(el) el.classList.add('show'); }
function closeModal(id) { 
  const el = document.getElementById(id); 
  if(el) el.classList.remove('show'); 
  document.querySelectorAll('.error').forEach(e => e.textContent = ""); 
}

  const input = document.getElementById("pinInput").value;
  if(input.length < 4) { document.getElementById("loginError").textContent = "४ अंकी पिन आवश्यक!"; return; }
  if(!adminPin) { adminPin = input; saveData(); syncToCloud(null, true); } 
  else if(adminPin !== input) { document.getElementById("loginError").textContent = "चुकीचा पिन!"; return; }
  
  isAdmin = true; closeModal('loginModal'); document.getElementById("pinInput").value = ""; initApp();

function renderSchoolList(searchQuery) {
  searchQuery = searchQuery || "";
  currentView = "list";
  const root = document.getElementById("appRoot");
  if(!root) return;
  
  let filtered = schools.map((s, i) => ({s: s, i: i}))
    .filter(x => {
      const matchesSearch = (x.s.name && x.s.name.includes(searchQuery)) || (x.s.udise && String(x.s.udise).includes(searchQuery));
      if (activeTab === "zp") return matchesSearch && x.s.category === "zp";
      if (activeTab === "other") return matchesSearch && x.s.category !== "zp";
      return matchesSearch;
    });

  filtered.sort((a, b) => {
    if (schoolSortBy === "nameAsc") return (a.s.name || "").localeCompare(b.s.name || "", 'mr');
    if (schoolSortBy === "nameDesc") return (b.s.name || "").localeCompare(a.s.name || "", 'mr');
    if (schoolSortBy === "udise") return String(a.s.udise || "").localeCompare(String(b.s.udise || ""));

  let html = `
    <div class="tabs">

      <button class="tab-btn ${activeTab==='other'?'active':''}" onclick="switchTab('other')">इतर शाळा (${schools.filter(s=>s.category!=='zp').length})</button>
    </div>

        <option value="nameDesc" ${schoolSortBy==='nameDesc'?'selected':''}>नावानुसार (ज्ञ-अ)</option>

    </div>

    ${isAdmin ? `
    <div class="card" style="padding:10px 14px; background:#eff6ff; border:1px solid #bfdbfe; margin-bottom:12px; display:flex; gap:8px; align-items:center; flex-wrap:wrap;">

function getSortedAndFilteredTeachers(teachersList) {
  if(!teachersList) return [];
  let list = [...teachersList];

  if (teacherAttFilter !== "all") {
    list = list.filter(t => (t.attendance || "उपस्थित") === teacherAttFilter);
  }

  if (teacherSortBy === "desig") {
    list.sort((a, b) => {
      const pA = DESIG_ORDER[a.desig] || 99;
      const pB = DESIG_ORDER[b.desig] || 99;
      if (pA !== pB) return pA - pB;
      return (a.name || "").localeCompare(b.name || "", 'mr');
    });
  } else if (teacherSortBy === "nameAsc") {
    list.sort((a, b) => (a.name || "").localeCompare(b.name || "", 'mr'));
  } else if (teacherSortBy === "nameDesc") {
    list.sort((a, b) => (b.name || "").localeCompare(a.name || "", 'mr'));
  } else if (teacherSortBy === "att") {
    const order = { "उपस्थित": 1, "गैरहजर": 2, "रजा": 3 };
    list.sort((a, b) => (order[a.attendance || "उपस्थित"] || 9) - (order[b.attendance || "उपस्थित"] || 9));
  }
  return list;
}

function updateAttendance(teacherId, status) {
  const s = schools[currentSchoolIdx];
  const t = s.teachers.find(x => x.id === teacherId);
  if(t) { t.attendance = status; saveData(); renderSchoolDetail(); }
}

function openTeacherModal(id) {
  editingTeacherId = id;
  const t = id ? schools[currentSchoolIdx].teachers.find(x => x.id === id) : null;
  document.getElementById("teacherModalTitle").textContent = t ? "शिक्षक संपादन" : "नवीन शिक्षक";
  document.getElementById("t_name").value = t ? t.name : "";
  document.getElementById("t_desig").value = t ? t.desig : "प्राथमिक शिक्षक";
  document.getElementById("t_mobile").value = t ? (t.mobile||"") : "";
  document.getElementById("btnDeleteTeacher").style.display = t ? "block" : "none";
  openModal("teacherModal");
}

function saveTeacher() {
  const name = document.getElementById("t_name").value.trim();
  if(!name) { document.getElementById("teacherError").textContent = "नाव आवश्यक आहे."; return; }
  const s = schools[currentSchoolIdx];
  if(editingTeacherId) {
    const t = s.teachers.find(x => x.id === editingTeacherId);
    t.name = name; t.desig = document.getElementById("t_desig").value; t.mobile = document.getElementById("t_mobile").value.trim();
  } else { 
    s.teachers.push(T(name, document.getElementById("t_desig").value, document.getElementById("t_mobile").value.trim())); 
  }
  saveData(); closeModal('teacherModal'); initApp();
  showToast("जतन केले!");
}

function deleteTeacher() {
  if(confirm("ही नोंद काढायची आहे का?")) {
    schools[currentSchoolIdx].teachers = schools[currentSchoolIdx].teachers.filter(x => x.id !== editingTeacherId);
    saveData(); closeModal('teacherModal'); initApp();
    showToast("काढले!");
  }
}

let tempSchoolIdx = null;
function openSchoolModal(idx) {
  tempSchoolIdx = idx;
  document.getElementById("schoolModalTitle").textContent = idx === null ? "नवीन शाळा" : "शाळा संपादन";
  document.getElementById("s_name").value = idx === null ? "" : schools[idx].name;
  document.getElementById("s_category").value = idx === null ? (activeTab==='zp'?'zp':'other') : (schools[idx].category || 'zp');
  document.getElementById("s_level").value = idx === null ? "प्राथमिक" : (schools[idx].level || "प्राथमिक");
  document.getElementById("s_udise").value = idx === null ? "" : schools[idx].udise;
  document.getElementById("s_hmpin").value = idx === null ? "" : (schools[idx].hmPin || "");
  openModal("schoolModal");
}

function saveSchool() {
  const name = document.getElementById("s_name").value.trim();
  const category = document.getElementById("s_category").value;
  const level = document.getElementById("s_level").value;
  const udise = document.getElementById("s_udise").value.trim();
  const hmPin = document.getElementById("s_hmpin").value.trim();
  if(!name || !udise) { document.getElementById("schoolError").textContent = "नाव आणि युडायस आवश्यक आहे."; return; }
  
  if(tempSchoolIdx === null) {
    schools.push({ category: category, level: level, name: name, udise: udise, hmPin: hmPin, teachers: [] });
  } else { 
    schools[tempSchoolIdx].name = name; 
    schools[tempSchoolIdx].category = category;
    schools[tempSchoolIdx].level = level;
    schools[tempSchoolIdx].udise = udise;
    schools[tempSchoolIdx].hmPin = hmPin;
  }
  saveData(); closeModal('schoolModal'); initApp();
  showToast("जतन केले!");
}

function deleteSchoolDirect(idx) {
  if(confirm(`"${schools[idx].name}" डिलीट करायचे का?`)) {
    schools.splice(idx, 1);
    saveData(); initApp();
    showToast("डिलीट केले!");
  }
}

function syncToCloud(btnElement, quiet) {
  quiet = quiet || false;
  const payload = { schools: schools, pin: adminPin };
  if(btnElement) {
    btnElement.dataset.original = btnElement.innerHTML;
    btnElement.textContent = "सेव्ह...";
    btnElement.disabled = true;
  }
  if (!window.fetch) {
    if(btnElement) btnElement.disabled = false;
    return;
  }
  fetch(GOOGLE_APP_SCRIPT_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  }).then(() => {
    if(!quiet) showToast("क्लाउडवर जतन केले!");
  }).catch(() => {
    if(!quiet) showToast("त्रुटी आली.");
  }).finally(() => {
    if(btnElement) {
      btnElement.innerHTML = btnElement.dataset.original || "☁️ सेव्ह";
      btnElement.disabled = false;
    }
  });
}

// Admin Attendance Report[span_2](start_span)[span_2](end_span)
function printFilteredReport(filterType) {
  filterType = filterType || "all";

  if(filterType === "गैरहजर") titleText = "शिक्षण परिषद - गैरहजर शिक्षक अहवाल";
  if(filterType === "रजा") titleText = "शिक्षण परिषद - रजेवरील शिक्षक अहवाल";

  let listToPrint = (activeTab === "all") ? schools : (activeTab === "zp" ? schools.filter(s=>s.category==='zp') : schools.filter(s=>s.category!=='zp'));

  let html = `
    <div class="print-page-block">
      <div class="print-header">
        <h1>${titleText}</h1>
        <div class="print-meta">
          <span>केंद्र: रविवार पेठ, ता. अंबाजोगाई, जि. बीड</span>
          <span>दिनांक: ${dateStr}</span>
        </div>
      </div>
  `;

  let contentGenerated = false;

  listToPrint.forEach((s, sIdx) => {
    let matchingTeachers = (s.teachers || []).filter(t => {
      const att = t.attendance || "उपस्थित";
      if (filterType === "all") return true;
      return att === filterType;
    });

    if (filterType !== "all" && matchingTeachers.length === 0) return;
    contentGenerated = true;
    const schoolLevel = s.level || (s.name.includes("हायस्कूल") ? "माध्यमिक" : "प्राथमिक");

    html += `
      <div class="print-school-header">${toMarathi(sIdx + 1)}. ${s.name} (स्तर: ${schoolLevel}) — शिक्षक संख्या: ${toMarathi(matchingTeachers.length)}</div>
      <table class="print-table">
        <thead>
          <tr>
            <th style="width:7%">अ.क्र.</th>
            <th style="width:38%">शिक्षकाचे नाव</th>
            <th style="width:23%">पदनाम</th>
            <th style="width:17%">मोबाईल</th>
            <th style="width:15%">उपस्थिती</th>
          </tr>
        </thead>
        <tbody>
    `;

    matchingTeachers.forEach((t, i) => {
      const att = t.attendance || "उपस्थित";
      let attDisplay = att;
      if(att === "गैरहजर") attDisplay = `<span style="color:#b91c1c; font-weight:bold;">गैरहजर</span>`;
      else if(att === "रजा") attDisplay = `<span style="color:#d97706; font-weight:bold;">रजा</span>`;
      else attDisplay = `<span style="color:#047857; font-weight:bold;">उपस्थित</span>`;

      html += `
        <tr>
          <td class="center">${toMarathi(i+1)}</td>
          <td style="font-weight:600;">${t.name}</td>
          <td>${t.desig}</td>
          <td class="center">${t.mobile || "-"}</td>
          <td class="center">${attDisplay}</td>
        </tr>
      `;
    });
    html += `</tbody></table>`;
  });

  if(!contentGenerated) html += `<div style="text-align:center; padding:20px;">या प्रवर्गात शिक्षक नाहीत.</div>`;

  html += `
      <div style="margin-top:15px; font-size:11px; border-top:1px dashed #000; padding-top:6px;">

  document.getElementById("printArea").innerHTML = html;
  if(window.print) window.print();
}
