<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>शिक्षण परीषद उपस्थिती प्रपत्र</title>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Marathi:ital@0;1&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #1b2c47;
  --gold: #b8862e;
  --maroon: #7c2432;
  --ink: #232323;
  --bg: #f4f6f9;
  --card: #ffffff;
  --border: #d1d5db;
}
* { box-sizing: border-box; }
body {
  margin: 0; padding: 0;
  background: var(--bg); color: var(--ink);
  font-family: 'Noto Sans Devanagari', sans-serif;
  min-height: 100vh;
}
h1, h2, h3 { font-family: 'Tiro Devanagari Marathi', serif; margin: 0; }
button { font-family: inherit; cursor: pointer; }

/* Header */
header.top {
  background: var(--navy); color: #fff;
  padding: 15px 20px; border-bottom: 4px solid var(--gold);
  display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
}
.title-block h1 { font-size: 1.5rem; }
.title-block p { margin: 5px 0 0; font-size: 0.85rem; color: #cbd5e1; }

.btn {
  background: transparent; color: #fff;
  border: 1px solid var(--gold);
  padding: 6px 14px; border-radius: 6px; font-weight: 600; transition: 0.2s;
}
.btn:hover { background: rgba(184,134,46,0.2); }
.btn.solid { background: var(--gold); color: #fff; border: none; }
.btn.solid:hover { background: #9c7225; }
.btn.danger { background: #fee2e2; color: var(--maroon); border: 1px solid #fca5a5; }
.btn.success { background: #10b981; color: #fff; border: none; }
.btn.success:hover { background: #059669; }
.btn.dark { background: #334155; color: #fff; border: none; }
.btn.dark:hover { background: #1e293b; }
.btn:disabled { opacity: 0.6; cursor: not-allowed; }

/* Main Layout */
main { max-width: 1000px; margin: 20px auto; padding: 0 15px; padding-bottom: 50px; }
.card { background: var(--card); padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 20px; }

/* Controls */
.controls { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; align-items: center; }
.controls input { flex: 1; min-width: 200px; padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 1rem; }
.controls select { padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 1rem; background: #fff; }

/* Tables */
.table-wrapper { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 600px; }
th, td { border: 1px solid var(--border); padding: 10px 12px; text-align: left; font-size: 0.95rem; }
th { background: #f8fafc; font-weight: 600; color: var(--navy); }
tr:hover { background: #f1f5f9; }
td.actions { text-align: center; white-space: nowrap; width: 100px; }
.icon-btn { background: none; border: none; font-size: 1.1rem; color: var(--navy); padding: 4px; cursor: pointer; }
.icon-btn.del { color: var(--maroon); margin-left: 8px; }

/* Dropdown styling */
.att-select { padding: 6px; border-radius: 4px; border: 1px solid var(--border); font-family: inherit; font-size: 0.9rem; background: #fff;}
.att-select:disabled { background: transparent; border: none; color: var(--ink); appearance: none; -webkit-appearance: none; font-weight: bold; }
.att-present { color: #10b981; font-weight: bold; }
.att-absent { color: #ef4444; font-weight: bold; }
.att-leave { color: #f59e0b; font-weight: bold; }

/* Modals */
.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.5);
  display: none; align-items: center; justify-content: center; z-index: 100;
}
.overlay.show { display: flex; }
.modal { background: #fff; width: 100%; max-width: 450px; border-radius: 10px; overflow: hidden; }
.modal-head { background: var(--navy); color: #fff; padding: 15px 20px; display: flex; justify-content: space-between; }
.modal-body { padding: 20px; }
.field { margin-bottom: 15px; }
.field label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 5px; color: var(--navy); }
.field input, .field select { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 1rem; }
.modal-foot { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
.error { color: var(--maroon); font-size: 0.85rem; min-height: 20px; }

/* Print Settings */
.print-settings { background: #e0f2fe; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; gap: 15px; align-items: flex-end; flex-wrap: wrap; border: 1px solid #bae6fd; }
.print-settings .box { flex: 1; min-width: 150px; }
.print-settings input { width: 100%; padding: 8px; border: 1px solid #93c5fd; border-radius: 4px; font-family: inherit; }

/* Toast */
#toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 20px; border-radius: 5px; font-size: 0.9rem; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 1000; }
#toast.show { opacity: 1; }

/* Print Styles */
#printArea { display: none; }
@media print {
  body * { visibility: hidden; }
  #printArea, #printArea * { visibility: visible; }
  #printArea { display: block; position: absolute; left: 0; top: 0; width: 100%; background: #fff; padding: 10mm; }
  
  .print-page-block { page-break-after: always; margin-bottom: 30px; }
  .print-page-block:last-child { page-break-after: avoid; }
  
  .print-header { text-align: center; margin-bottom: 15px; border-bottom: 2px solid #000; padding-bottom: 10px; }
  .print-header h1 { font-size: 20px; margin-bottom: 6px; }
  .print-meta { display: flex; justify-content: space-between; font-weight: bold; font-size: 13px; }
  .print-school-name { font-size: 16px; font-weight: bold; margin: 15px 0 10px; background: #f0f0f0; padding: 6px; border: 1px solid #000; display: flex; justify-content: space-between; }
  
  table.print-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 10px; }
  table.print-table th, table.print-table td { border: 1px solid #000; padding: 6px 8px; text-align: left; vertical-align: middle; }
  table.print-table th { background: #e2e2e2 !important; -webkit-print-color-adjust: exact; text-align: center; }
  table.print-table td.center { text-align: center; }
}
</style>
</head>

<header class="top">

    <p>तालुका: अंबाजोगाई • जिल्हा: बीड (Database Connected)</p>
  </div>
  <div id="authArea"></div>

    </div>
  </div>
</div>

// ==========================================
// DATA LOADING
// ==========================================
async function loadData() {
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) {
        const data = JSON.parse(raw);
        schools = data.schools || [];
        adminPin = data.pin || "";
    } else {
        schools = JSON.parse(JSON.stringify(DEFAULT_SCHOOLS));
    }
    initApp();

    try {
        const response = await fetch(GOOGLE_APP_SCRIPT_URL + "?t=" + new Date().getTime());
        const cloudText = await response.text();
        if(cloudText && cloudText.trim() !== "" && cloudText !== "[]") {
            const cloudData = JSON.parse(cloudText);
            if(cloudData.schools && Array.isArray(cloudData.schools)) {
                schools = cloudData.schools;
                adminPin = cloudData.pin || "";
                localStorage.setItem(STORAGE_KEY, JSON.stringify({schools, pin: adminPin}));
                initApp();
                showToast("✅ क्लाउडवरून नवीन डेटा अपडेट झाला.");
            }
        }
    } catch(e) {
        console.log("Cloud load offline/failed.");
    }
}

function saveData() { 
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ schools, pin: adminPin })); 
}

// ==========================================
// UI & AUTH
// ==========================================
function showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 3000);
}
function openModal(id) { document.getElementById(id).classList.add('show'); }
function closeModal(id) { 
    document.getElementById(id).classList.remove('show'); 
    document.querySelectorAll('.error').forEach(e => e.textContent = ""); 
}
const MARATHI_DIGITS = ["०","१","२","३","४","५","६","७","८","९"];
function toMarathi(n) { return String(n).split("").map(d => MARATHI_DIGITS[+d] ?? d).join(""); }

function renderAuth() {
    const div = document.getElementById("authArea");
    if (isAdmin) {
        div.innerHTML = `
          <span style="margin-right:10px;">🟢 ॲडमिन मोड</span>
          <button class="btn" style="margin-right:6px;" onclick="openResetPinModal()">🔑 पिन बदला</button>
          <button class="btn" onclick="logout()">बाहेर पडा</button>
        `;
    } else {
        div.innerHTML = `<button class="btn solid" onclick="openModal('loginModal')">प्रशासक प्रवेश</button>`;
    }
}
function login() {
    const input = document.getElementById("pinInput").value;
    if(input.length < 4) { document.getElementById("loginError").textContent = "४ अंकी पिन आवश्यक!"; return; }
    if(!adminPin) { adminPin = input; saveData(); syncToCloud(null, true); } 
    else if(adminPin !== input) { document.getElementById("loginError").textContent = "चुकीचा पिन!"; return; }
    
    isAdmin = true; closeModal('loginModal'); document.getElementById("pinInput").value = ""; initApp();
}
function logout() { isAdmin = false; initApp(); }

// ==========================================
// PIN RESET / CHANGE
// ==========================================
function openResetPinModal() {
    document.getElementById("currPin").value = "";
    document.getElementById("newPin").value = "";
    document.getElementById("confPin").value = "";
    document.getElementById("resetPinError").textContent = "";
    openModal("resetPinModal");
}

function changeAdminPin() {
    const curr = document.getElementById("currPin").value.trim();
    const newP = document.getElementById("newPin").value.trim();
    const conf = document.getElementById("confPin").value.trim();
    const err = document.getElementById("resetPinError");

    if (adminPin && curr !== adminPin) {
        err.textContent = "सध्याचा पिन चुकीचा आहे!";
        return;
    }
    if (newP.length < 4) {
        err.textContent = "नवीन पिन किमान ४ अंकी असावा!";
        return;
    }
    if (newP !== conf) {
        err.textContent = "नवीन पिन आणि कन्फर्म पिन जुळत नाहीत!";
        return;
    }

    adminPin = newP;
    saveData();
    closeModal("resetPinModal");
    showToast("✅ प्रशासक पिन यशस्वीरित्या बदलला!");
    syncToCloud(null, true);
}

// ==========================================
// RENDER LOGIC
// ==========================================
function initApp() {
    renderAuth();
    if (currentView === "list") renderSchoolList(document.getElementById("searchInput")?.value || "");
    else renderSchoolDetail();
}

function changeSort(val) {
    schoolSortBy = val;
    initApp();
}

function renderSchoolList(searchQuery = "") {
    currentView = "list";
    const root = document.getElementById("appRoot");
    
    let filtered = schools.map((s, i) => ({s, i}))
        .filter(x => x.s.name.includes(searchQuery) || x.s.udise.includes(searchQuery));

    filtered.sort((a, b) => {
        if (schoolSortBy === "nameAsc") return a.s.name.localeCompare(a.s.name, 'mr');
        if (schoolSortBy === "nameDesc") return b.s.name.localeCompare(a.s.name, 'mr');
        if (schoolSortBy === "udise") return String(a.s.udise).localeCompare(String(b.s.udise));
        if (schoolSortBy === "teachers") return (b.s.teachers?.length || 0) - (a.s.teachers?.length || 0);
        return 0;
    });

    let html = `
      <div class="controls">
        <input type="text" id="searchInput" placeholder="शाळा किंवा युडायस शोधा..." onkeyup="renderSchoolList(this.value)" value="${searchQuery}">
        
        <select onchange="changeSort(this.value)">
          <option value="nameAsc" ${schoolSortBy==='nameAsc'?'selected':''}>नावानुसार (अ-ज्ञ)</option>
          <option value="nameDesc" ${schoolSortBy==='nameDesc'?'selected':''}>नावानुसार (ज्ञ-अ)</option>
          <option value="udise" ${schoolSortBy==='udise'?'selected':''}>युडायस कोडनुसार</option>
          <option value="teachers" ${schoolSortBy==='teachers'?'selected':''}>शिक्षक संख्येनुसार</option>
        </select>
        
        ${isAdmin ? `
          <button class="btn dark" onclick="printAllSchoolsReport()">📑 सर्व शाळा उपस्थिती अहवाल</button>
          <button class="btn success" id="syncBtn1" onclick="syncToCloud(this)">☁️ क्लाउडवर सेव्ह करा</button>
          <button class="btn solid" onclick="openSchoolModal(null)">+ नवीन शाळा जोडा</button>
        ` : ``}
      </div>
      <div class="card table-wrapper">
        <table>
          <thead><tr><th>अ.क्र.</th><th>शाळेचे नाव</th><th>युडायस कोड</th><th>शिक्षक संख्या</th>${isAdmin ? '<th style="text-align:center">कृती</th>' : ''}</tr></thead>
          <tbody>
    `;
    if(filtered.length === 0) html += `<tr><td colspan="${isAdmin?5:4}" style="text-align:center">माहिती उपलब्ध नाही</td></tr>`;
    
    filtered.forEach((item, idx) => {
        html += `<tr onclick="if(!event.target.closest('.actions-cell')) openSchool(${item.i})">
            <td>${toMarathi(idx + 1)}</td>
            <td style="font-weight:bold; color:var(--navy)">${item.s.name}</td>
            <td>${item.s.udise}</td>
            <td>${toMarathi(item.s.teachers ? item.s.teachers.length : 0)}</td>
            ${isAdmin ? `
              <td class="actions actions-cell">
                <button class="icon-btn" title="संपादित करा" onclick="openSchoolModal(${item.i})">✎</button>
                <button class="icon-btn del" title="शाळा डिलीट करा" onclick="deleteSchoolDirect(${item.i})">🗑️</button>
              </td>` : ''}
          </tr>`;
    });
    html += `</tbody></table></div>`;
    root.innerHTML = html;
}

        <p style="margin-top: 0; color: #666;">युडायस कोड: ${s.udise}</p>
        
        <div class="print-settings">
            <div class="box"><label>स्थळ:</label><input type="text" id="pVenue" value="रविवार पेठ, अंबाजोगाई, जि. बीड"></div>
            <div class="box"><label>दिनांक:</label><input type="date" id="pDate" value="${today}"></div>
            <div style="display:flex; gap:10px;">
              <button class="btn solid" onclick="printData()">🖨️ PDF / Print</button>
              ${isAdmin ? `<button class="btn success" id="syncBtn2" onclick="syncToCloud(this)">☁️ क्लाउडवर सेव्ह करा</button>` : ``}
            </div>
        </div>

        <div class="controls" style="justify-content: flex-end;">
          ${isAdmin ? `<button class="btn solid" onclick="openTeacherModal(null)">+ नवीन शिक्षक</button>` : ``}
        </div>
        
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th style="width:60px; text-align:center;">अ.क्र.</th>
                <th>शिक्षकाचे नाव</th>
                <th>पदनाम</th>
                <th>मोबाईल</th>
                <th>उपस्थिती</th>
                ${isAdmin ? '<th style="text-align:center;">कृती</th>' : ''}
              </tr>
            </thead>
            <tbody>
    `;

    if(!s.teachers || s.teachers.length === 0) {
        html += `<tr><td colspan="6" style="text-align:center; padding:20px;">शिक्षक माहिती उपलब्ध नाही.</td></tr>`;
    }

    (s.teachers || []).forEach((t, i) => {
        let att = t.attendance || "उपस्थित";
        let attClass = att === "उपस्थित" ? "att-present" : (att === "गैरहजर" ? "att-absent" : "att-leave");
        
        html += `
          <tr>
            <td style="text-align:center;">${toMarathi(i + 1)}</td>
            <td style="font-weight:600;">${t.name}</td>
            <td>${t.desig}</td>
            <td>${t.mobile || "-"}</td>
            <td>
              <select class="att-select ${attClass}" onchange="updateAttendance('${t.id}', this.value)" ${isAdmin ? '' : 'disabled'}>
                <option value="उपस्थित" ${att==='उपस्थित'?'selected':''}>उपस्थित</option>
                <option value="गैरहजर" ${att==='गैरहजर'?'selected':''}>गैरहजर</option>
                <option value="रजा" ${att==='रजा'?'selected':''}>रजा</option>
              </select>
            </td>
            ${isAdmin ? `<td class="actions"><button class="icon-btn" onclick="openTeacherModal('${t.id}')">✎</button></td>` : ''}
          </tr>
        `;
    });

    html += `</tbody></table></div></div>`;
    root.innerHTML = html;
}

// Update Attendance Inline
function updateAttendance(teacherId, status) {
    const s = schools[currentSchoolIdx];
    const t = s.teachers.find(x => x.id === teacherId);
    if(t) { t.attendance = status; saveData(); initApp(); }
}

// ==========================================
// CRUD TEACHER & SCHOOL
// ==========================================
function openTeacherModal(id) {
    editingTeacherId = id;
    const t = id ? schools[currentSchoolIdx].teachers.find(x => x.id === id) : null;
    document.getElementById("teacherModalTitle").textContent = t ? "शिक्षक संपादित करा" : "नवीन शिक्षक जोडा";
    document.getElementById("t_name").value = t ? t.name : "";
    document.getElementById("t_desig").value = t ? t.desig : "प्राथमिक शिक्षक";
    document.getElementById("t_mobile").value = t ? (t.mobile||"") : "";
    document.getElementById("btnDeleteTeacher").style.display = t ? "block" : "none";
    openModal("teacherModal");
}
function saveTeacher() {
    const name = document.getElementById("t_name").value.trim();
    if(!name) { document.getElementById("teacherError").textContent = "नाव आवश्यक आहे."; return; }
    const s = schools[currentSchoolIdx];
    if(editingTeacherId) {
        const t = s.teachers.find(x => x.id === editingTeacherId);
        t.name = name; t.desig = document.getElementById("t_desig").value; t.mobile = document.getElementById("t_mobile").value.trim();
    } else { s.teachers.push(T(name, document.getElementById("t_desig").value, document.getElementById("t_mobile").value.trim())); }
    saveData(); closeModal('teacherModal'); initApp();
}
function deleteTeacher() {
    if(confirm("ही नोंद काढायची आहे का?")) {
        schools[currentSchoolIdx].teachers = schools[currentSchoolIdx].teachers.filter(x => x.id !== editingTeacherId);
        saveData(); closeModal('teacherModal'); initApp();
    }
}

let tempSchoolIdx = null;
function openSchoolModal(idx) {
    tempSchoolIdx = idx;
    document.getElementById("schoolModalTitle").textContent = idx === null ? "नवीन शाळा जोडा" : "शाळा संपादित करा";
    document.getElementById("s_name").value = idx === null ? "" : schools[idx].name;
    document.getElementById("s_udise").value = idx === null ? "" : schools[idx].udise;
    openModal("schoolModal");
}
function saveSchool() {
    const name = document.getElementById("s_name").value.trim();
    const udise = document.getElementById("s_udise").value.trim();
    if(!name || !udise) { document.getElementById("schoolError").textContent = "नाव आणि युडायस आवश्यक आहे."; return; }
    if(tempSchoolIdx === null) schools.push({ name, udise, teachers: [] });
    else { schools[tempSchoolIdx].name = name; schools[tempSchoolIdx].udise = udise; }
    saveData(); closeModal('schoolModal'); initApp();
}

// Direct Delete School function from main list
function deleteSchoolDirect(idx) {
    const schoolName = schools[idx].name;
    if(confirm(`"${schoolName}" ही शाळा आणि त्यातील सर्व शिक्षकांची माहिती कायमची डिलीट करायची आहे का?`)) {
        schools.splice(idx, 1);
        saveData();
        initApp();
        showToast("शाळा यशस्वीरित्या डिलीट केली.");
    }
}

// ==========================================
// CLOUD SYNC
// ==========================================
async function syncToCloud(btnElement, quiet = false) {
    const payload = { schools: schools, pin: adminPin };
    
    if(btnElement) {
        btnElement.dataset.original = btnElement.innerHTML;
        btnElement.textContent = "⌛ सेव्ह होत आहे...";
        btnElement.disabled = true;
    }

    try {
        await fetch(GOOGLE_APP_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });
        if(!quiet) showToast("✅ संपूर्ण डेटा Google Sheet (क्लाउड) वर सुरक्षित जतन झाला!");
    } catch(err) {
        if(!quiet) showToast("❌ त्रुटी आली. तुमचे इंटरनेट कनेक्शन तपासा.");
    } finally {
        if(btnElement) {
            btnElement.innerHTML = btnElement.dataset.original || "☁️ क्लाउडवर सेव्ह करा";
            btnElement.disabled = false;
        }
    }
}

                <tr>

                    <th style="width:18%">मोबाईल नंबर</th>

            </thead>

    `;

    if (!s.teachers || s.teachers.length === 0) {
         html += `<tr><td colspan="5" class="center" style="padding:15px;">माहिती उपलब्ध नाही.</td></tr>`;

// ==========================================
// PRINT (All Schools Combined Attendance Report)
// ==========================================
function printAllSchoolsReport() {
    const today = new Date();
    const dateStr = `${String(today.getDate()).padStart(2, '0')}/${String(today.getMonth()+1).padStart(2, '0')}/${today.getFullYear()}`;
    
    // Overall Stats
    let totalT = 0, presT = 0, absT = 0, leaveT = 0;
    schools.forEach(s => {
        (s.teachers || []).forEach(t => {
            totalT++;
            const att = t.attendance || "उपस्थित";
            if(att === "उपस्थित") presT++;
            else if(att === "गैरहजर") absT++;
            else if(att === "रजा") leaveT++;
        });
    });

    let html = `
      <div class="print-page-block">
        <div class="print-header">
            <h1>शिक्षण परीषद - सर्व शाळा एकत्रित उपस्थिती अहवाल</h1>
            <div class="print-meta">
              <span>तालुका: अंबाजोगाई • जिल्हा: बीड</span>
              <span>दिनांक: ${dateStr}</span>
            </div>
            <div style="font-size:12px; margin-top:8px; font-weight:bold;">
              एकूण शिक्षक: ${toMarathi(totalT)} | उपस्थित: ${toMarathi(presT)} | गैरहजर: ${toMarathi(absT)} | रजा: ${toMarathi(leaveT)}
            </div>
        </div>
    `;

    schools.forEach((s, sIdx) => {
        let sPres = 0, sAbs = 0, sLeave = 0;
        (s.teachers || []).forEach(t => {
            const att = t.attendance || "उपस्थित";
            if(att === "उपस्थित") sPres++;
            else if(att === "गैरहजर") sAbs++;
            else if(att === "रजा") sLeave++;
        });

        html += `
          <div class="print-school-name">
            <span>${toMarathi(sIdx + 1)}. ${s.name} (UDISE: ${s.udise})</span>
            <span style="font-size:12px; font-weight:normal;">उपस्थित: <b>${toMarathi(sPres)}</b> | गैरहजर: <b>${toMarathi(sAbs)}</b> | रजा: <b>${toMarathi(sLeave)}</b></span>
          </div>
          <table class="print-table">
            <thead>
                <tr>
                    <th style="width:6%">अ.क्र.</th>
                    <th style="width:30%">शिक्षकाचे नाव</th>
                    <th style="width:20%">पदनाम</th>
                    <th style="width:16%">मोबाईल</th>
                    <th style="width:13%">उपस्थिती</th>
                    <th style="width:15%">शेरा</th>
                </tr>
            </thead>
            <tbody>
        `;

        if (!s.teachers || s.teachers.length === 0) {
            html += `<tr><td colspan="6" class="center" style="padding:10px;">माहिती उपलब्ध नाही.</td></tr>`;
        } else {
            s.teachers.forEach((t, i) => {
                const att = t.attendance || "उपस्थित";
                let attDisplay = att;
                if(att === "गैरहजर") attDisplay = `<span style="color:#b91c1c; font-weight:bold;">गैरहजर</span>`;
                else if(att === "रजा") attDisplay = `<span style="color:#d97706; font-weight:bold;">रजा</span>`;
                else attDisplay = `<span style="color:#047857; font-weight:bold;">उपस्थित</span>`;

                html += `
                  <tr>
                      <td class="center">${toMarathi(i+1)}</td>
                      <td style="font-weight:600;">${t.name}</td>
                      <td>${t.desig}</td>
                      <td class="center">${t.mobile || "-"}</td>
                      <td class="center">${attDisplay}</td>
                      <td></td>
                  </tr>
                `;
            });
        }
        html += `</tbody></table>`;
    });

    html += `</div>`;
    document.getElementById("printArea").innerHTML = html;
    window.print();
}
